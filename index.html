
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Coupe du Monde 2026</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

h1 {
  text-align: center;
}

.match {
  background: white;
  padding: 15px;
  margin: 10px auto;
  border-radius: 10px;
  max-width: 500px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.live {
  border-left: 5px solid red;
}

.ft {
  border-left: 5px solid green;
}
</style>

</head>

<body>

<h1>⚽ Coupe du Monde 2026</h1>
<div id="matches">Chargement...</div>

<script>
const API_URL = "https://api.wc2026api.com/matches"; // API exemple

async function loadMatches() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    const container = document.getElementById("matches");
    container.innerHTML = "";

    data.forEach(match => {

      const div = document.createElement("div");
      div.className = "match";

      // Style selon statut
      if(match.status === "LIVE") div.classList.add("live");
      if(match.status === "FT") div.classList.add("ft");

      div.innerHTML = `
        <strong>${match.home_team} vs ${match.away_team}</strong><br>
        📍 ${match.stadium}<br>
        🕒 ${new Date(match.kickoff_utc).toLocaleString()}<br>
        📊 Statut : ${match.status}
      `;

      container.appendChild(div);
    });

  } catch (error) {
    document.getElementById("matches").innerHTML = "❌ Erreur API";
    console.error(error);
  }
}

// refresh toutes les 30s
setInterval(loadMatches, 30000);

// premier chargement
loadMatches();
</script>

</body>
</html>
